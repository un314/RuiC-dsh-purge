- insert:
    - id: ruic-dsh-purge
      name: ruic-dsh-purge
      config:
        enabled: true
        autoApplyOnStart: false
        # Reinforce workspace instructions in memory; needed on sealed (signed
        # ASAR) installations where the package files cannot be patched.
        runtimeOverride: true
